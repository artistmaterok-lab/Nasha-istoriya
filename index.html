<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💍 Наша история — Артём Глинский</title>
<style>
:root{--bg:#101014;--card:#19191f;--line:#34343c;--text:#f7f5f2;--muted:#aaa6ad;--gold:#e9b95d;--green:#79d49b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29221d,#101014 45%);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 15px 55px}.brand{text-align:center;color:#d7b978;font-size:13px}.hero{text-align:center;padding:24px 8px}.hero h1{font:700 44px Georgia,serif;margin:8px 0}.hero p{color:var(--muted);line-height:1.5}.card{background:rgba(25,25,31,.96);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 14px 35px #0005}input,button{font:inherit;width:100%;border-radius:15px;padding:13px 14px;margin:5px 0;border:1px solid var(--line)}input{background:#111118;color:white}button{background:#25252d;color:white;cursor:pointer;font-weight:700}button.gold{background:#3b2d18;border-color:#8d6a31;color:#ffd981}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#121218;border-radius:15px;padding:10px;text-align:center;font-size:11px}.stat b{display:block;font-size:19px;margin-bottom:3px}.bar{height:12px;background:#302f35;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#d09c83}.stage{border:1px solid var(--line);border-radius:19px;padding:14px;margin:9px 0}.stage.locked{opacity:.45}.stage.open{border-color:#675331}.stage.done{border-color:#47775a}.stageTop{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;color:#d5c6a8;white-space:nowrap}.task{display:flex;gap:9px;align-items:flex-start;text-align:left;background:#111118;border:1px solid #303038;padding:11px 12px;margin:4px 0}.task b{font-size:14px;line-height:1.2}.task small{font-size:11px;line-height:1.2}.task.done{opacity:.55;border-color:#47775a}.task small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.reward{border-color:#8b6a31;background:linear-gradient(145deg,#2b2418,#19191f)}.secret{border-color:#66517b;background:#211b29}.muted{color:var(--muted);font-size:13px}.center{text-align:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#27262d;color:#ddd;font-size:11px}
</style></head><body><div class="wrap">
<div class="brand">🎤 Ведущий Артём Глинский · авторский формат</div>
<div class="hero"><h1>💍 Наша история</h1><p>Добрейший свадебный квест</p></div>
<div class="card compactProfile"><h3>👰🤵 Ваша пара <span class="pill">необязательно сейчас</span></h3><input id="bride" placeholder="Имя невесты"><input id="groom" placeholder="Имя жениха"><input id="wdate" type="date"><button onclick="saveProfile()">💞 Сохранить данные пары</button><div id="share" class="muted"></div></div>
<div id="dash"></div><div id="play"></div><div id="route"></div>
</div>
<script>
const STAGES=[
["🌱","Основа свадьбы","Первые решения"],
["🌿","Создаём праздник","Площадка и атмосфера"],
["🌳","Мы команда","Гости и организация"],
["🌸","Финальная подготовка","Образы, документы и детали"],
["💍","Главный день","Последние проверки"]
];
const TASKS=[
["Определить дату свадьбы","Выберите дату, которая подходит вам обоим."],["Определить формат свадьбы","Решите, каким должен быть ваш праздник."],["Сформулировать бюджет","Назовите комфортную сумму и основные статьи."],["Распределить роли","Договоритесь, кто за что отвечает."],["Составить приоритеты","Выберите 3 вещи, которые для вас особенно важны."],["Определить город и локацию","Решите, где хотите провести день."],["Определить количество гостей","Сделайте первый рабочий список."],["Составить список обязательных решений","Запишите решения, которые нельзя откладывать."],
["Выбрать площадку","Сравните варианты по вашим главным критериям."],["Определиться со стилем","Соберите настроение свадьбы в нескольких словах."],["Продумать декор","Определите ключевые зоны и детали."],["Выбрать ведущего","Сформулируйте, каким должен быть ведущий."],["Выбрать музыку","Соберите музыку для важных моментов."],["Составить тайминг","Набросайте последовательность дня."],["Определить фото и видео","Решите, какие моменты точно хотите сохранить."],["Продумать церемонию","Обсудите формат и важные слова."],
["Составить список гостей","Уточните имена и контакты."],["Решить вопрос рассадки","Продумайте комфорт гостей."],["Распределить задачи","Назначьте ответственных за конкретные дела."],["Собрать контакты подрядчиков","Сведите всё в один удобный список."],["Обсудить помощь родителей","Договоритесь, где помощь действительно нужна."],["Подготовить приглашения","Согласуйте текст и способ отправки."],["Продумать транспорт гостей","Поймите, кому и как добираться."],["Составить план коммуникации","Решите, где будут все важные обновления."],
["Подобрать образы","Соберите варианты и согласуйте общий настрой."],["Запланировать примерки","Поставьте примерки в календарь."],["Подготовить кольца","Проверьте хранение и готовность колец."],["Проверить документы","Убедитесь, что нужные документы в порядке."],["Собрать emergency-kit","Сложите маленький набор на непредвиденные случаи."],["Продумать красоту и уход","Запланируйте процедуры без лишней спешки."],["Подготовить вещи на утро","Соберите всё заранее."],["Сделать финальный чек-лист","Проверьте всё, что должно быть готово."],
["Подтвердить подрядчиков","Свяжитесь со всеми и подтвердите детали."],["Проверить оплаты и договоры","Сверьте суммы, сроки и договорённости."],["Подтвердить меню","Финально согласуйте еду и особые пожелания."],["Проверить торт","Подтвердите дизайн, вкус и время доставки."],["Подготовить вещи на площадку","Сложите всё по понятным коробкам или сумкам."],["Назначить ответственного","Выберите человека, который сможет решать вопросы."],["Провести финальный штаб вдвоём","Спокойно пройдитесь по всему плану."],["Создать план на случай сюрпризов","Решите, что делать, если что-то пойдёт не по плану."]]];
const HOST=["Не пытайтесь решить всё за один вечер — один понятный шаг уже двигает вас вперёд.","Сначала договоритесь о главном, а детали подтянутся.","Хороший план оставляет место для живого дня.","Запишите решение так, чтобы через неделю его понял каждый из вас.","Если мнения расходятся, сначала назовите, почему это важно каждому.","Выбирайте не идеальный вариант, а тот, который подходит именно вам.","Проверяйте решения вопросом: «Это делает наш день спокойнее?»","Свадебная подготовка — совместный проект, а не экзамен.","Разделяйте задачи так, чтобы никто не чувствовал себя один.","Не забывайте отмечать уже сделанное — прогресс тоже часть праздника.","Сравнивайте варианты по вашим критериям, а не по чужим свадьбам.","Оставьте немного воздуха в бюджете и расписании.","Красивое решение особенно хорошо, когда оно ещё и удобное.","Договорённость лучше держать в одном месте, а не в пяти чатах.","Если пункт вызывает спор, поставьте его на паузу и вернитесь позже.","Хороший подрядчик понимает не только задачу, но и ваше настроение.","Сделайте список обязательного коротким — так им легче управлять.","Ваш праздник не обязан соответствовать чужому шаблону.","Сначала комфорт людей, потом декоративные детали.","Чем раньше зафиксирована договорённость, тем меньше тревоги.","Попросить помощь — тоже организационный навык.","Один ответственный на задачу часто спокойнее, чем четыре человека одновременно.","Приглашение должно отвечать на главный вопрос: где и когда встречаемся?","У гостей тоже есть логистика — чем понятнее она, тем спокойнее день.","Оставляйте важные контакты там, где их легко найти.","Образы лучше проверять не только глазами, но и на удобство.","Финальные примерки — хорошее время проверить всё до мелочей.","Кольца должны быть в надёжном месте и у понятного человека.","Документы любят спокойствие: проверьте их заранее.","Emergency-kit нужен не для тревоги, а чтобы не отвлекаться на мелочи.","Перед свадьбой красота должна помогать расслабиться, а не создавать марафон.","Соберите утро так, чтобы вам не пришлось искать носки за пять минут до выхода.","Финальный чек-лист должен снимать вопросы, а не добавлять новые.","Подтверждение подрядчиков — маленькое сообщение, которое даёт много спокойствия.","Договор и оплата должны быть понятны обоим, кто отвечает за них.","Меню лучше проверить с учётом реальных ограничений гостей.","Торт должен приехать вовремя — за доставку лучше отвечать конкретному человеку.","Коробки с вещами подпишите: так утром не придётся устраивать квест внутри квеста.","Назначенный ответственный позволит вам самим проживать свой день.","Финальный штаб — не повод нервничать, а возможность сказать: «Мы готовы».","План Б не портит праздник — он помогает спокойно встретить неожиданность."];
const SWIPE=["Что для нас важнее всего в этом пункте?","Если оставить только один элемент, что мы сохраним?","Где мы готовы уступить друг другу?","Что сделает этот день именно нашим?","Что здесь можно упростить без потери смысла?","Что мы хотим вспоминать через десять лет?","Кому из нас эта деталь особенно важна и почему?","Что поможет нам меньше нервничать?","Что мы можем сделать вместе прямо сейчас?","Где нам нужна помощь, а где лучше справиться вдвоём?"];
const FUNNY=["принести кофе, даже если тебя не просили.","отдать последний вкусный кусочек и сделать вид, что не хотелось.","знать, где лежит зарядка другого человека.","сказать «я рядом» и действительно остаться рядом.","не будить человека, если он наконец уснул.","помнить любимую вкусняшку лучше любого списка покупок.","смеяться над одной и той же шуткой в сотый раз.","сначала обнять, а потом обсуждать таблицу расходов.","знать, когда нужен совет, а когда нужен чай.","смотреть на свадебный бюджет и всё ещё выбирать любовь."];
const GOLD=[
["Не потеряйте главное","Свадьба начинается не с декора, а с человека рядом.","Назовите друг другу то, чего больше всего ждёте в семейной жизни."],
["Сделайте свадьбу своей","Самые сильные истории нельзя скопировать.","Назовите одну деталь, которую хотите сделать только по-своему."],
["Готовьтесь вместе","Подготовка уже становится частью вашей семейной истории.","Отложите дела на пять минут и просто побудьте рядом."],
["Оставьте место настоящему","Лучшие моменты не всегда помещаются в тайминг.","Придумайте маленький момент, понятный только вам двоим."],
["Запомните этот момент","Один день станет воспоминанием на всю жизнь.","Закончите фразу: «В день свадьбы я хочу обязательно запомнить…»"]];
const SECRETS=[
["Начало истории","Каждый назовите, чего больше всего ждёте от семейной жизни."],["Воспоминание","Загадка: то, что нельзя потрогать, но можно хранить годами. Ответ: воспоминание. Найдите общую фотографию и расскажите её историю."],["Три слова","Каждый назовите три слова, описывающие ваши отношения. Повторы запрещены."],["Наш символ","Найдите рядом предмет, который напоминает вам о вашей паре."],["Вкусное воспоминание","Каждый назовите блюдо, связанное с приятным общим воспоминанием."],["Наша песня","Каждый назовите песню, которая напоминает о вашей истории."],["Через год","Закончите: «Через год я хочу, чтобы мы обязательно…»"],["Тайный знак","Придумайте жест или фразу со смыслом: «давай минуту только вдвоём»."],["Маленькое спасибо","Каждый назовите одну вещь, за которую благодарны друг другу сегодня."],["Финальная глава","Закончите: «Я хочу, чтобы в день нашей свадьбы мы обязательно…»"]];
let id=new URLSearchParams(location.search).get("pair")||crypto.randomUUID();if(!location.search)history.replaceState({},'',location.pathname+"?pair="+id);
let key="nasha:"+id,s=JSON.parse(localStorage.getItem(key)||"{}");s.done=s.done||[];s.xp=s.xp||0;s.anxiety=s.anxiety??100;s.gold=s.gold||[];s.secrets=s.secrets||[];s.swipes=s.swipes||0;
function save(){localStorage.setItem(key,JSON.stringify(s))}
function level(){return s.xp<100?"Салаги":s.xp<300?"Планировщики":s.xp<600?"Стратеги":s.xp<900?"Свадебные гуру":"Легенды ЗАГСа"}
function anxietyText(){return s.anxiety>75?"Пока немного волнительно… и это нормально.":s.anxiety>50?"Потихоньку разбираемся. Уже не так страшно.":s.anxiety>25?"Большая часть дел позади. Дышим спокойнее.":"Вы почти у цели. Осталось совсем немного ❤️"}
function count(i){return s.done.filter(x=>Math.floor(x/100)===i).length}
function unlocked(i){return i===0||count(i-1)===8}
function saveProfile(){s.bride=document.getElementById("bride").value.trim();s.groom=document.getElementById("groom").value.trim();s.date=document.getElementById("wdate").value;save();render()}
function complete(stage,t){let k=stage*100+t;if(!unlocked(stage)||s.done.includes(k))return;s.done.push(k);s.xp+=25;s.anxiety=Math.max(10,Math.round(100-s.done.length*1.35));s.reward={stage,t};save();render()}
function discuss(){s.xp+=10;s.swipes++;s.anxiety=Math.max(10,s.anxiety-1);s.reward.discussed=true;save();render()}
function closeReward(){s.reward=null;save();render()}
function openGold(i){s.gold[i]=true;save();play.innerHTML='<div class="card reward"><h2>🏆 '+GOLD[i][0]+'</h2><p>'+GOLD[i][1]+'</p><div class="card"><b>💞 Мини-задание</b><p>'+GOLD[i][2]+'</p><p>📸 Сделайте фото «только для двоих». Мы сохраняем только отметку о моменте.</p></div><button class="gold" onclick="closePlay()">Совет сохранён ❤️</button></div>'}
function closePlay(){play.innerHTML="";render()}
function openSecret(i){if(!s.secrets.includes(i)){s.secrets.push(i);s.xp+=35;save()}play.innerHTML='<div class="card secret"><span class="pill">+35 XP</span><h2>🔐 '+SECRETS[i][0]+'</h2><p>'+SECRETS[i][1]+'</p><button onclick="closePlay()">Глава прожита ❤️</button></div>'}
function render(){
document.getElementById("bride").value=s.bride||"";document.getElementById("groom").value=s.groom||"";document.getElementById("wdate").value=s.date||"";document.getElementById("share").innerHTML=s.bride&&s.groom?"🔗 Ссылка пары: "+location.href:"";
dash.innerHTML=s.bride?'<div class="card"><h2 class="center">'+s.bride+' ❤️ '+s.groom+'</h2><p class="center">'+(s.date?("До свадьбы: "+Math.max(0,Math.ceil((new Date(s.date+"T12:00:00")-new Date())/86400000))+" дней"):"Дата не выбрана")+'</p><div class="stats"><div class="stat"><b>'+s.xp+'</b>⭐ XP</div><div class="stat"><b>'+s.done.length+'/40</b>✅ дела</div><div class="stat"><b>'+level()+'</b>🎖 уровень</div></div><p class="muted">😌 Тревожность: '+s.anxiety+'%</p><div class="bar"><i style="width:'+s.anxiety+'%"></i></div><p class="muted">'+anxietyText()+'</p></div>':"";
route.innerHTML='<div class="card"><h2>🗺️ Ваш свадебный путь</h2><p class="muted">В открытом этапе все 8 заданий доступны сразу. Выбирайте любое — порядок полностью за вами.</p>'+STAGES.map((x,i)=>{let c=count(i),op=unlocked(i);return '<div class="stage '+(op?'open':'locked')+' '+(c===8?'done':'')+'"><div class="stageTop"><h3>'+x[0]+' '+x[1]+'</h3><span class="badge">'+(c===8?"✓ готово":op?"🔓 открыто":"🔒 закрыто")+'</span></div><p class="muted">'+x[2]+' · '+c+'/8</p>'+TASKS.slice(i*8,i*8+8).map((t,j)=>{let k=i*100+j,d=s.done.includes(k);return '<button class="task '+(d?'done':'')+'" '+(!op||d?'disabled':'')+' onclick="complete('+i+','+j+')">'+(d?"✅":"⬜")+' <span><b>'+t[0]+'</b><small>'+t[1]+'</small></span></button>'}).join('')+'</div>'}).join('')+'</div>';
let secret=i=>s.secrets.includes(i)?'<button disabled>✓ '+SECRETS[i][0]+'</button>':'<button onclick="openSecret('+i+')">🔐 '+SECRETS[i][0]+' · секретная глава</button>';
let secretsHTML='<div class="card"><h2>🔐 Секретные главы</h2><p class="muted">Они не обязательны для открытия этапов. Каждая прожитая глава даёт +35 XP.</p>'+SECRETS.map((_,i)=>secret(i)).join('')+'</div>';
let goldHTML='<div class="card"><h2>🏆 Золотые конверты</h2>'+GOLD.map((g,i)=>count(i)===8?'<button class="gold" onclick="openGold('+i+')">'+(s.gold[i]?"✓ ":"🏆 ")+g[0]+'</button>':'').join('')+'</div>';
let r=s.reward;if(r){let n=r.stage*8+r.t,task=TASKS[n];play.innerHTML='<div class="card reward"><span class="pill">🎉 Задание выполнено · +25 XP</span><h2>'+task[0]+'</h2><p>🎤 <b>Совет Артёма:</b> '+HOST[n]+'</p><p>💞 <b>Любовь — это…</b> '+FUNNY[n%FUNNY.length]+'</p><div class="card"><b>💬 Мини-свайп</b><p>'+SWIPE[n%SWIPE.length]+'</p>'+(!r.discussed?'<button onclick="discuss()">Обсудили вдвоём · +10 XP</button>':'<p class="muted">✓ Обсуждение отмечено</p>')+'</div><button onclick="closeReward()">Продолжить без выбора следующей задачи →</button></div>'}else{let next=[0,1,2,3,4].find(i=>unlocked(i)&&count(i)<8);play.innerHTML=next===undefined?'<div class="card center"><h2>💍 Все 40 задач выполнены!</h2><p>Вы дошли до конца основного маршрута. Теперь проживите этот день, а не проверяйте чек-лист.</p></div>': '<div class="card"><h2>✨ Выбирайте любую задачу</h2><p class="muted">Открытый этап уже виден ниже. Нажмите любую из 8 задач — порядок выбираете вы.</p></div>'+goldHTML+secretsHTML}
}
render();
</script></body></html>
