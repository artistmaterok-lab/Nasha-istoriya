];

const ADVICE=["Не стремитесь к идеальной свадьбе. Сделайте её своей — той, в которой узнаёте именно себя.","Когда вокруг много дел, сначала найдите друг друга глазами. Это возвращает главное на своё место.","Оставьте в свадебном дне место для случайных счастливых моментов. Их невозможно записать в тайминг.","Берегите силы не только на праздник, но и друг на друга. Ваша команда важнее любой детали.","Ваша задача перед свадьбой — не успеть всё на свете, а заранее снять с себя максимум лишних забот.","Один ответственный человек для организационных вопросов в день свадьбы может подарить вам десятки спокойных минут.","Не откладывайте подтверждение подрядчиков: одна актуальная таблица контактов лучше десятка переписок.","В день свадьбы сначала найдите друг друга глазами, а потом занимайтесь расписанием.","Попросить помощи — значит сохранить силы на главное.","Не сравнивайте вашу свадьбу с чужими. Ваш чек-лист должен работать на вашу пару.","Самая красивая деталь дня — когда вам спокойно рядом друг с другом.","Если что-то пойдёт не по плану, сначала найдите друг друга, а потом решайте проблему.","Хороший тайминг оставляет запас. Не заполняйте каждую минуту событиями.","Сохраняйте не только фотографии, но и истории, которые стоят за ними.","Пусть среди подготовки каждый день остаётся хотя бы несколько минут без свадебных разговоров.","Не бойтесь что-то упростить. Лёгкость тоже может быть частью красивой свадьбы.","Ваш главный свадебный ресурс — взаимная поддержка, а не идеальность каждого пункта.","Пусть у каждого из вас будет один момент свадьбы, которого он особенно ждёт.","Запишите важные телефоны заранее и отдайте их человеку, который сможет решить вопрос без вас.","Проверьте документы, кольца и оплату заранее — это три вещи, о которых особенно приятно не думать в день свадьбы.","Разносите обувь до свадьбы. Это маленькая подготовка, которая сильно влияет на настроение.","Сделайте план Б для погоды, но не позволяйте ему украсть радость от плана А.","Оставьте хотя бы один const LEVELS=[[0,"Салаги"],[100,"Планировщики"],[300,"Стратеги"],[600,"Свадебные гуру"],[900,"Легенды ЗАГСа"]];
let s=load();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");return{xpn:Number(x?.xpn)||Number(x?.xp)||0,done:Array.isArray(x?.done)?x.done.filter(n=>Number.isInteger(n)&&n>=0&&n<40):[],envelopes:Array.isArray(x?.envelopes)?x.envelopes.filter(n=>Number.isInteger(n)&&n>=0&&n<5):[]}}catch(e){return{xpn:0,done:[],envelopes:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function cnt(k){return s.done.filter(x=>x>=k*8&&x<(k+1)*8).length}
function unlocked(k){return true}
function lvl(){let n="Салаги";for(const x of LEVELS)if(s.xpn>=x[0])n=x[1];return n}
function prog(){let cats=[0,1,2,3,4].filter(k=>cnt(k)===8).length;return Math.min(100,Math.round(s.done.length/40*80+cats*2+s.envelopes.length/5*10))}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function popup(icon,title,body){let d=document.createElement("div");d.className="pop";d.innerHTML='<div><div style="font-size:42px">'+icon+'</div><h2>'+esc(title)+'</h2><p>'+esc(body)+'</p><button class="close">Вернуться к чек-листу</button></div>';d.querySelector(".close").onclick=()=>d.remove();document.body.appendChild(d)}
function complete(id){if(s.done.includes(id)||!unlocked(Math.floor(id/8)))return;s.done.push(id);s.xpn+=25;save();render();popup("💛","Пункт выполнен","+25 XP\n\nСовет от Артёма:\n"+ADVICE[id])}
function openEnvelope(k){if(cnt(k)!==8||s.envelopes.includes(k))return;s.envelopes.push(k);s.xpn+=50;save();render();popup("✉️","Золотой конверт","+50 XP\n\nСовет от Артёма:\n"+ADVICE[k*8+7]+"\n\nВаш маленький бонус:\n"+BONUS[k])}
function render(){let p=prog(),n=s.done.length;document.getElementById("xp").textContent=s.xpn;document.getElementById("level").textContent=lvl();document.getElementById("anx").textContent=Math.max(10,Math.round(100-n*1.35))+"%";document.getElementById("bar").style.width=p+"%";document.getElementById("sum").textContent=n+" из 40 · "+(p<20?"Начинаем спокойно":p<40?"Основа складывается":p<60?"Организация движется":p<80?"Большая часть готова":p<100?"Финальные штрихи":"Ваша свадьба собрана");let q=Math.max(1,Math.ceil(p/20));document.getElementById("heart").textContent="❤️".repeat(q)+"🤍".repeat(5-q);
let html="";ST.forEach((st,k)=>{let c=cnt(k),op=unlocked(k);html+='<section class="stage '+(op?"":"locked ")+(c===8?"done":"")+'"><div class="head"><div><h2>'+st[0]+" "+st[1]+'</h2><div class="muted">'+st[2]+'</div></div><span class="badge">'+c+"/8 "+(op?"":"🔒")+'</span></div>';for(let j=0;j<8;j++){let id=k*8+j,d=s.done.includes(id);html+='<button class="task '+(d?"done":"")+'" '+(d||!op?"disabled":"")+' data-t="'+id+'">'+(d?"❤️":"🤍")+" "+esc(T[id][0])+'<br><span class="muted">'+esc(T[id][1])+"</span></button>"}if(c===8){let opened=s.envelopes.includes(k);html+='<div class="gold"><b>✨ Золотой конверт этапа</b><p>'+(opened?"Совет и бонус уже открыты и сохранены.":"Он появляется только после выполнения всех 8 пунктов этого этапа.")+'</p>'+(!opened?'<button data-e="'+k+'">Открыть золотой конверт</button>':'<div class="bonus"><b>Ваш бонус:</b> '+esc(BONUS[k])+"</div>")+"</div>"}html+="</section>"});document.getElementById("game").innerHTML=html;document.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>complete(+x.dataset.t));document.querySelectorAll("[data-e]").forEach(x=>x.onclick=()=>openEnvelope(+x.dataset.e));
