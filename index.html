const LEVELS=[[0,"Салаги"],[100,"Планировщики"],[300,"Стратеги"],[600,"Свадебные гуру"],[900,"Легенды ЗАГСа"]];

function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");return{xpn:Number(x?.xpn)||Number(x?.xp)||0,done:Array.isArray(x?.done)?x.done.filter(n=>Number.isInteger(n)&&n>=0&&n<40):[],envelopes:Array.isArray(x?.envelopes)?x.envelopes.filter(n=>Number.isInteger(n)&&n>=0&&n<5):[]}}catch(e){return{xpn:0,done:[],envelopes:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function cnt(k){return s.done.filter(x=>x>=k*8&&x<(k+1)*8).length}
function unlocked(k){return k===0||cnt(k-1)===8}
function lvl(){let n="Салаги";for(const x of LEVELS)if(s.xpn>=x[0])n=x[1];return n}
function prog(){let cats=[0,1,2,3,4].filter(k=>cnt(k)===8).length;return Math.min(100,Math.round(s.done.length/40*80+cats*2+s.envelopes.length/5*10))}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function complete(id){if(s.done.includes(id)||!unlocked(Math.floor(id/8)))return;s.done.push(id);s.xpn+=25;save();render();popup("💛","Задание выполнено","+25 XP\n\nСовет от Артёма:\n"+ADVICE[id])}
function openEnvelope(k){if(cnt(k)!==8||s.envelopes.includes(k))return;s.envelopes.push(k);s.xpn+=50;save();render();popup("✉️","Золотой конверт","+50 XP\n\nСовет от Артёма:\n"+ADVICE[k*8+7]+"\n\nДополнительное задание:\n"+BONUS[k])}

 document.getElementById("final").innerHTML=n===40?'<section class="card final"><div style="font-size:44px">💍❤️</div><h2>Ваша история собрана</h2><p>Вы прошли все 40 заданий и открыли пять золотых конвертов.</p><p><b>Финальный совет от Артёма</b><br>Не стремитесь быть идеальной парой. Старайтесь каждый день оставаться командой: разговаривать, смеяться, поддерживать друг друга и снова выбирать «мы».</p><p>Пусть в вашей семье будет больше разговоров, чем догадок, больше объятий, чем претензий и больше маленьких счастливых моментов, чем больших планов.</p><p><b>Если понадобится помощь, идея или совет по вашему празднику — можете написать или позвонить Артёму:</b><br><a href="tel:89246005001">8 924 600 500 1</a></p><p>— Артём</p></section>':""
