function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&Array.isArray(x.done)?{done:[...new Set(x.done.filter(Number.isInteger))],xp:Number(x.xp)||0,opened:Array.isArray(x.opened)?x.opened:[],bonusDone:Array.isArray(x.bonusDone)?x.bonusDone:[],final:!!x.final}: {done:[],xp:0,opened:[],bonusDone:[],final:false}}catch{return{done:[],xp:0,opened:[],bonusDone:[],final:false}}}

function countStage(i){return state.done.filter(x=>x>=i*8&&x<(i+1)*8).length}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
document.getElementById("xp").textContent=state.xp;
document.getElementById("level").textContent=level();
document.getElementById("anxiety").textContent=anxiety()+"%";
document.getElementById("heart").textContent=heart();
document.getElementById("bar").style.width=(state.done.length/40*100)+"%";
document.getElementById("summary").textContent="Выполнено "+state.done.length+" из 40 · сердце "+Math.round(state.done.length/40*100)+"%";
let html="";
STAGES.forEach((s,i)=>{
const c=countStage(i),open=unlocked(i);
html+=`<section class="card stage ${open?"":"locked"} ${c===8?"done":""}"><div class="stageHead"><h2>${s[0]} ${s[1]}</h2><span class="badge">${c===8?"✓ готово":open?"🔓 открыто":"🔒 следующий этап"}</span></div><p class="muted">${s[2]} · ${c}/8</p>`;
for(let j=0;j<8;j++){const k=i*8+j,d=state.done.includes(k);html+=`<button class="task ${d?"done":""}" data-task="${k}" ${!open||d?"disabled":""}>${d?"✅":"⬜"} <b>${esc(TASKS[k][0])}</b><br><small class="muted">${esc(TASKS[k][1])}</small></button>`}
html+="</section>"});
html+=`<section class="card"><h2>🏆 Золотые конверты</h2><p class="muted">Конверт появляется после полной категории. Нажмите ещё раз, чтобы открыть особенное задание.</p>`;
for(let i=0;i<5;i++)if(countStage(i)===8)html+=`<button class="gold" data-gold="${i}">${state.opened.includes(i)?"✓":"🏆"} ${esc(["Первый конверт · Мы начинаем","Второй конверт · Наш праздник","Третий конверт · Наша команда","Четвёртый конверт · Наши детали","Пятый конверт · Наш день"][i])}</button>`;
html+="</section>";
html+=`<section class="card"><h2>🔐 Секретные главы</h2><p class="muted">Не обязательны. Каждая глава даёт +35 XP.</p>`;
SECRETS.forEach((x,i)=>html+=`<button data-secret="${i}" ${state.bonusDone.includes("s"+i)?"disabled":""}>${state.bonusDone.includes("s"+i)?"✓":"🔐"} ${esc(x[0])}</button>`);
html+="</section>";
document.getElementById("game").innerHTML=html;
document.getElementById("final").innerHTML=state.done.length===40?`<section class="card final"><h2>💍 Ваша история собрана</h2><p>Вы прошли все 40 шагов. Теперь начинается самая важная часть — ваша жизнь после праздника.</p><button data-final>🔐 Открыть совет Артёма</button></section>`:"";
}
function complete(k){if(state.done.includes(k))return;state.done.push(k);state.xp+=25;save();render();showTask(k)}
function showTask(k){const p=document.createElement("div");p.className="popup";p.innerHTML=`<div class="popupBox"><div class="popupIcon">✨</div><h2>Задание выполнено</h2><p>💫 +25 XP</p><p><b>${esc(TASKS[k][0])}</b></p><p class="tip">🎤 Совет Артёма: ${esc(HOST[k])}</p><div class="bonus"><b>💞 Любовь — это…</b><br>${esc(LOVE[k])}</div><button data-close>Вернуться к квесту</button></div>`;document.body.appendChild(p)}
function showGold(i){state.opened=[...new Set([...state.opened,i])];save();const p=document.createElement("div");p.className="popup";p.innerHTML=`<div class="popupBox"><div class="popupIcon">🏆</div><h2>${esc(["Первый конверт · Мы начинаем","Второй конверт · Наш праздник","Третий конверт · Наша команда","Четвёртый конверт · Наши детали","Пятый конверт · Наш день"][i])}</h2><div class="bonus"><b>💛 Дополнительное задание</b><p>${esc(BONUS[i*8+(state.opened.length-1)%8])}</p><p>📸 Сделайте фото только для вас двоих и сохраните его как маленькую тайну вашей истории.</p></div><button data-close>Сохранить этот момент ❤️</button></div>`;document.body.appendChild(p)}
function showSecret(i){if(!state.bonusDone.includes("s"+i)){state.bonusDone.push("s"+i);state.xp+=35;save();render()}const p=document.createElement("div");p.className="popup";p.innerHTML=`<div class="popupBox"><div class="popupIcon">🔐</div><h2>${esc(SECRETS[i][0])}</h2><p>${esc(SECRETS[i][1])}</p><p class="tip">+35 XP</p><button data-close>Глава прожита ❤️</button></div>`;document.body.appendChild(p)}
function showFinal(){state.final=true;save();const p=document.createElement("div");p.className="popup";p.innerHTML=`<div class="popupBox"><div class="popupIcon">💍</div><h2>Совет от Артёма</h2><p>${esc(FINAL_ADVICE[0])}</p><p>${esc(FINAL_ADVICE[1])}</p><p><b>— Артём</b></p><button data-close>❤️ Сохранить этот совет</button></div>`;document.body.appendChild(p)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-task]");if(t){complete(Number(t.dataset.task));return}const g=e.target.closest("[data-gold]");if(g){showGold(Number(g.dataset.gold));return}const s=e.target.closest("[data-secret]");if(s){showSecret(Number(s.dataset.secret));return}if(e.target.closest("[data-final]")){showFinal();return}if(e.target.closest("[data-close]"))e.target.closest(".popup")?.remove()});
render();
</script>
</body>
</html>
