<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf7"><title>💍 Наша история — Артём Глинский</title><style>
:root{--bg:#fffaf7;--card:#fff;--text:#594a47;--muted:#9a8882;--line:#eee1dc;--gold:#d5ad65;--green:#e3f1e5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fffaf7,#f8f2ef);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 80px}.brand{text-align:center;color:#ad8582;font-size:12px}.hero{text-align:center;padding:34px 8px 26px}.hero h1{font:600 45px Georgia,serif;margin:0 0 10px}.hero p{color:var(--muted)}.card,.stage{background:#fff;border:1px solid var(--line);border-radius:25px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #755b5010}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#fcf7f4;border-radius:17px;padding:12px 4px;color:var(--muted);font-size:11px}.stat b{display:block;color:var(--text);font-size:19px}.heart{text-align:center;font-size:32px;letter-spacing:4px;margin:17px 0 5px}.pulse{animation:p .6s}.bar{height:8px;background:#eee5e1;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e6b8b7,#d6ae68);transition:.5s}.stage{padding:17px}.stage.locked{opacity:.45}.stage.done{background:#fbfffc;border-color:#cfe2d3}.head{display:flex;justify-content:space-between;gap:10px}.badge,.muted{font-size:12px;color:var(--muted)}button{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin:6px 0;color:var(--text);font-weight:650;text-align:left;cursor:pointer}button:hover:not(:disabled){transform:translateY(-1px);border-color:#dfb8b7}.task.done{background:var(--green);opacity:.65}.gold{padding:16px;border:1px solid #e8d1a2;border-radius:20px;background:linear-gradient(145deg,#fff4c8,#ffe19a);animation:o .5s}.gold button{background:#fff}.bonus{padding:13px;background:#fffaf0;border-radius:15px;margin-top:8px}.final{text-align:center;line-height:1.75;font-size:17px}.pop{position:fixed;inset:0;background:#5c494540;backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:9}.pop>div{max-width:500px;width:100%;background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 25px 70px #59463b30}.close{background:#d8ad61;color:#fff;text-align:center}@keyframes o{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes p{45%{transform:scale(1.14)}}@media(max-width:600px){.hero h1{font-size:37px}}
</style></head><body><div class="wrap"><div class="brand">🎤 Ведущий Артём Глинский · авторский формат</div><header class="hero"><h1>💍 Наша история</h1><p>Добрейший свадебный квест</p></header><section class="card"><div class="stats"><div class="stat"><b id="xp">0</b>XP</div><div class="stat"><b id="level">Салаги</b>уровень</div><div class="stat"><b id="anx">100%</b>волнение</div></div><div id="heart" class="heart">🤍🤍🤍🤍🤍</div><div class="bar"><i id="bar"></i></div><p id="sum" class="muted" style="text-align:center"></p></section><div id="game"></div><div id="final"></div></div><script>
const KEY="nasha-history-stable-final";const ST=[
["🌱","Наша встреча"],["💌","Наша любовь"],["🤝","Наша команда"],["💍","Наша свадьба"],["🌟","Наше будущее"]];
const T=[
["Вспомните день первой встречи","Что осталось в памяти сильнее всего?"],["Расскажите первое впечатление друг о друге","Что оказалось неожиданным?"],["Назовите три качества, которые вас объединили","Без повторов."],["Вспомните самый смешной момент начала отношений","Перескажите его как сцену фильма."],["Назовите ваше особенное место","Почему оно стало вашим?"],["Расскажите момент: «это мой человек»","Назовите дату, ситуацию или деталь."],["Найдите первую совместную фотографию","Вспомните тот день."],["Придумайте символ вашей пары","Предмет, слово, жест или место."],
["Назовите пять благодарностей друг другу","Каждый называет минимум две новые."],["Сделайте личный комплимент","Без слов «красивый» и «люблю»."],["Выберите вашу песню","Какой момент она напоминает?"],["Вспомните самый счастливый день","Каждый назовёт свой фрагмент."],["Расскажите о поступке, который тронул","Почему он запомнился?"],["Назовите сильную сторону вашей пары","Приведите пример."],["Составьте пять общих мечт","Одна должна быть маленькой и реальной."],["Напишите короткое признание","Прочитайте его вслух."],
["Опишите идеальный обычный семейный день","Без праздника и путешествий."],["Создайте семейный девиз","До семи слов."],["Выберите общую цель на год","Назовите первый шаг."],["Придумайте секретное слово пары","Оно означает: «мне нужен ты рядом»."],["Опишите дом, куда хочется возвращаться","Назовите три ощущения."],["Придумайте будущую семейную традицию","Что повторять каждый год?"],["Назовите три правила счастливой пары","Каждый добавляет своё."],["Скажите, в чём вы команда","Конкретный пример."],
["Выберите главный момент свадьбы","Что хотите помнить через двадцать лет?"],["Опишите идеальное утро свадьбы","Что происходит до первого события?"],["Подготовьте слова благодарности близким","Кому и за что?"],["Выберите символ свадьбы","Почему он ваш?"],["Придумайте свадебное обещание","Одно настоящее обещание."],["Представьте первый вечер после свадьбы","Где вы и о чём говорите?"],["Напишите письмо друг другу на первую годовщину","Каждый пишет свою часть."],["Придумайте личный момент только для двоих","Он может длиться одну минуту."],
["Представьте жизнь через десять лет","Опишите обычный счастливый день."],["Создайте карту пяти путешествий","Одно место должно быть новым."],["Назовите мечту, которую исполните вместе","С чего начнёте?"],["Придумайте семейный праздник","Дата, смысл и традиция."],["Создайте капсулу времени","Три вещи или три записи сегодня."],["Назовите качество, которое сохраните навсегда","Почему?"],["Скажите, за что выбрали бы друг друга снова","Новый ответ."],["Закончите: «Через много лет я хочу, чтобы мы…»","Скажите вслух друг другу."]];
const B=[
"Сделайте совместное фото и дайте ему название, которое поймёте только вы двое.","Назовите три места для побега вдвоём на один день.","Вспомните момент, когда вы смеялись до слёз.","Напишите сообщение друг другу, которое откроете на первую годовщину.","Придумайте ритуал для обычного понедельника.","Назовите предмет рядом, который напоминает о вашей истории.","Выберите блюдо, которое станет вашим семейным вкусом.","Придумайте название первой главы вашей книги.","Назовите одну милую привычку друг друга.","Запишите три места, куда хотите вернуться.","Составьте пять вещей, которые всегда поднимают вам настроение.","Придумайте жест «давай минуту только вдвоём».","Выберите песню для вашей будущей десятой годовщины.","Вспомните самый неожиданный подарок.","Опишите идеальный воскресный завтрак.","Назовите вещь, которой хотите научиться вместе.","Придумайте три маленьких приключения на полгода.","Опишите ваше идеальное семейное утро.","Назовите поступок другого, который хочется сохранить в памяти.","Придумайте название вашей семейной команды.","Запишите пять слов про дом мечты.","Придумайте историю к одной вашей фотографии через двадцать лет.","Назовите место для будущего Нового года.","Придумайте семейную шутку.","Скажите одну вещь, которую обычно забываете произнести.","Закончите вместе: «Давайте никогда не перестанем…»","Придумайте ваш тайный знак радости.","Назовите воспоминание, которое расскажете детям.","Выберите ваш домашний фильм на особый вечер.","Назовите мечту друг друга, которой готовы помогать.","Придумайте традицию каждой годовщины.","Запишите обещание обычной совместной жизни.","Назовите место для спонтанного свидания.","Соберите плейлист из трёх песен вашей истории.","Придумайте название вашему любимому будущему месту.","Назовите три вещи, которые хотите делать без телефонов.","Запишите, чему хотите научиться друг у друга.","Придумайте семейный праздник без повода.","Назовите момент сегодняшнего дня, который хочется запомнить.","Закончите: «Наша история хороша тем, что…»"];
const H=["Не стремитесь к идеальной свадьбе. Сделайте её своей.","Если задача огромная — превратите её в один маленький шаг.","Оставляйте место для случайных счастливых моментов.","Праздник начинается с людей, а не с декора.","В день свадьбы сначала найдите друг друга глазами.","Ваши воспоминания уже красивее любого сценария.","Не бойтесь говорить «нам так не подходит».","Хороший тайминг оставляет время просто посмотреть друг на друга.","Попросить помощи — значит сохранить силы на главное.","Не сравнивайте вашу историю с чужими свадьбами.","Смех — один из лучших свадебных аксессуаров.","После свадьбы продолжайте ходить друг к другу на свидания.","Вы уже команда, если остаётесь на одной стороне.","Пусть среди чек-листов остаётся место для нежности.","Самая красивая деталь дня — ваше спокойствие рядом.","Свадьба закончится за день. Ваша команда останется.","Главное решение уже принято: вы выбрали друг друга.","Пять минут разговора иногда ценнее часа планирования.","Не превращайте подготовку в экзамен.","Ваше «мы» складывается из маленьких «я рядом».","Берегите силы на момент, когда всё начнётся.","Лёгкость тоже может быть частью красивой свадьбы.","Один честный разговор часто экономит много нервов.","Ваш праздник не обязан быть похож на чей-то.","Пусть у каждого будет момент дня, который он особенно ждёт.","Запоминайте не только фото, но и ощущения.","Хорошее обещание работает и в обычный вторник.","Если что-то пойдёт не по плану — сначала найдите друг друга.","Ваш главный ресурс — поддержка.","Оставьте сегодня вечер хотя бы на пять минут без свадебных разговоров.","Счастье пары — это не отсутствие сложностей, а умение возвращаться друг к другу.","Не вычёркивайте из плана всё спонтанное.","Самые дорогие воспоминания часто не были запланированы.","Выбирайте то, о чём через годы будете рассказывать с улыбкой.","Пусть ваши решения будут вашими, а не модными.","Сохраните силы не только на праздник, но и на следующий день.","В хорошей паре нет победителя спора.","Маленькая забота сегодня становится большой историей завтра.","Ваша свадьба — начало главы, а не финал.","Берегите человека рядом, а не только красивый день."];
const LOVE=["Любовь — это знать, где второй спрятал вкусное.","Любовь — это «я купил тебе то, что ты не просил».","Любовь — это делать чай обоим после спора о том, кто устал больше.","Любовь — это знать любимую кружку друг друга.","Любовь — это двадцать минут выбирать фильм.","Любовь — это человек для мемов любой степени странности.","Любовь — это молчать рядом и чувствовать разговор.","Любовь — это знать, когда нужен совет, а когда объятия.","Любовь — это маленькое «береги себя».","Любовь — это внутренняя шутка, которую никто больше не понимает."];
const LV=[[0,"Салаги"],[100,"Планировщики"],[300,"Стратеги"],[600,"Свадебные гуру"],[900,"Легенды ЗАГСа"]];
let s=load();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");return{xp:Number(x?.xp)||0,done:Array.isArray(x?.done)?x.done:[],open:Array.isArray(x?.open)?x.open:[]}}catch(e){return{xp:0,done:[],open:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function cnt(k){return s.done.filter(x=>x>=k*8&&x<(k+1)*8).length}
function unlocked(k){return k===0||cnt(k-1)===8}
function lvl(){let n="Салаги";for(const x of LV)if(s.xp>=x[0])n=x[1];return n}
function prog(){let cats=[0,1,2,3,4].filter(k=>cnt(k)===8).length;return Math.min(100,Math.round(s.done.length/40*80+cats*2+s.open.length/40*10))}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function popup(icon,title,body){let d=document.createElement("div");d.className="pop";d.innerHTML='<div><div style="font-size:42px">'+icon+'</div><h2>'+esc(title)+'</h2><p>'+esc(body)+'</p><div class="bonus"><b>«Любовь — это…»</b><br>'+esc(LOVE[s.done.length%LOVE.length])+'</div><button class="close">Вернуться к квесту</button></div>';d.querySelector(".close").onclick=()=>d.remove();document.body.appendChild(d)}
function done(id){if(s.done.includes(id)||!unlocked(Math.floor(id/8)))return;s.done.push(id);s.xp+=25;save();render();popup("💛","Задание выполнено","+25 XP · "+H[id])}
function envelope(id){if(!s.open.includes(id)){s.open.push(id);s.xp+=10;save()}render();popup("✉️","Золотой конверт","+10 XP · бонусное задание: "+B[id])}
function render(){
 let p=prog(),n=s.done.length;document.getElementById("xp").textContent=s.xp;document.getElementById("level").textContent=lvl();document.getElementById("anx").textContent=Math.max(10,Math.round(100-n*1.35))+"%";document.getElementById("bar").style.width=p+"%";document.getElementById("sum").textContent=n+" из 40 · "+(p<20?"Начало вашей истории":p<40?"Первые совместные решения":p<60?"Вы уже настоящая команда":p<80?"Большая часть пути пройдена":p<100?"Финальные штрихи":"Ваша история собрана");let q=Math.max(1,Math.ceil(p/20)),heart=document.getElementById("heart");heart.textContent="❤️".repeat(q)+"🤍".repeat(5-q);heart.classList.remove("pulse");void heart.offsetWidth;heart.classList.add("pulse");
 let html="";ST.forEach((st,k)=>{let c=cnt(k),op=unlocked(k);html+='<section class="stage '+(op?"":"locked ")+(c===8?"done":"")+'"><div class="head"><div><h2>'+st[0]+" "+st[1]+'</h2><div class="muted">'+(op?"Все 8 заданий доступны":"Откроется после предыдущего этапа")+'</div></div><span class="badge">'+c+"/8 "+(op?"":"🔒")+'</span></div>';for(let j=0;j<8;j++){let id=k*8+j,d=s.done.includes(id),o=s.open.includes(id);html+='<button class="task '+(d?"done":"")+'" '+(d||!op?"disabled":"")+' data-t="'+id+'">'+(d?"❤️":"🤍")+" "+esc(T[id][0])+'<br><span class="muted">'+esc(T[id][1])+"</span></button>";if(d)html+='<div class="gold"><b>✨ Золотой конверт</b><p>'+(o?"Бонус уже открыт и сохранён.":"Нажмите, чтобы открыть ещё одно задание для двоих.")+'</p>'+(!o?'<button data-e="'+id+'">Открыть конверт</button>':'<div class="bonus">'+esc(B[id])+"</div>")+"</div>"}html+="</section>"});document.getElementById("game").innerHTML=html;document.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>done(+x.dataset.t));document.querySelectorAll("[data-e]").forEach(x=>x.onclick=()=>envelope(+x.dataset.e));document.getElementById("final").innerHTML=n===40?'<section class="card final"><div style="font-size:44px">💍❤️</div><h2>Ваша история собрана</h2><p>Вы прошли все 40 шагов. Но настоящий квест только начинается.</p><p><b>Совет от Артёма</b><br>Не стремитесь быть идеальной парой. Старайтесь каждый день оставаться командой: разговаривать, смеяться, поддерживать друг друга и снова выбирать «мы».</p><p>Пусть в вашей семье будет больше разговоров, чем догадок, больше объятий, чем претензий и больше маленьких счастливых моментов, чем больших планов.</p><p>— Артём</p></section>':""}
render();
</script></body></html>
