*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#fffdfb 0%,#fbf7f4 55%,#f8f3f0 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}

.stage.locked{opacity:.42;background:#fcfaf9}
.stage.open{border-color:#ead4d1}
.stage.done{border-color:#d0e0d5;background:#fcfffd}
.stageTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.badge{font-size:11px;color:#99827d;white-space:nowrap;padding-top:4px}
.task{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid #f0e6e1;padding:14px 15px;margin:7px 0}
.task b{font-size:14px;line-height:1.3}
.task small{font-size:11px;line-height:1.35;color:var(--muted);display:block;margin-top:4px;font-weight:400}
.task.done{opacity:.55;border-color:#d2e2d7;background:#fcfffd}
.reward{border-color:#ead7b6;background:linear-gradient(145deg,#fffaf1,#fff)}
.secret{border-color:#ded3e8;background:#fdfaff}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--rose-soft);color:#9d7775;font-size:11px}
.popup{position:fixed;inset:0;background:rgba(82,61,56,.18);backdrop-filter:blur(5px);display:grid;place-items:center;padding:24px;z-index:9999}

.popupIcon{font-size:40px}.popupBox h2{margin:10px 0;color:#594847}.popupBox .xp{color:#b58a4e}.popupBox .host{color:#9d817c;line-height:1.65}

const GOLD_KEY="nasha_story_v2";

async function sha256(v){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function randomToken(){return crypto.randomUUID()+"-"+crypto.randomUUID()}
async function rpc(fn,args){const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:JSON.stringify(args)});if(!r.ok)throw new Error("RPC "+fn+" "+r.status);return r.json()}

}

 try{
  if(!ownerToken&&!deviceToken){if(await pairExists()){showAccessGate()}else{await claimOwner();render();}return}
  const token=ownerToken||deviceToken;const rows=await rpc("get_pair",{p_pair_id:pairId,p_token_hash:await sha256(token)});
  if(rows[0]){const row=rows[0],cloud=row.state&&typeof row.state==="object"?row.state:{};s={...s,...cloud,done:Array.isArray(cloud.done)?cloud.done.filter(Number.isInteger):s.done,gold:Array.isArray(cloud.gold)?cloud.gold:s.gold,secrets:Array.isArray(cloud.secrets)?cloud.secrets:s.secrets,xp:Number.isFinite(cloud.xp)?cloud.xp:s.xp,anxiety:Number.isFinite(cloud.anxiety)?cloud.anxiety:s.anxiety,bride:row.bride_name||s.bride,groom:row.groom_name||s.groom,date:row.wedding_date||s.date};saveLocal();render();}
 }catch(err){console.warn(err);showSyncError()}
}
async function cloudSave(){
 try{
  if(!ownerToken&&!deviceToken)return;
  await rpc("save_pair",{p_pair_id:pairId,p_token_hash:await sha256(ownerToken||deviceToken),p_bride:s.bride||"",p_groom:s.groom||"",p_date:s.date||null,p_state:cloudState()});
 }catch(e){console.warn("Cloud save failed",e)}
}
function saveLocal(){localStorage.setItem(key,JSON.stringify(s))}
const pairId=new URLSearchParams(location.search).get("pair")||crypto.randomUUID();
if(!location.search)history.replaceState({},document.title,location.pathname+"?pair="+pairId);
const key=GOLD_KEY+":"+pairId;
let syncTimer=null;
let ownerToken=localStorage.getItem("nasha_owner:"+pairId)||"";
let deviceToken=localStorage.getItem("nasha_device:"+pairId)||"";

function defaultState(){return{done:[],xp:0,anxiety:100,bride:"",groom:"",date:"",gold:[],secrets:[],swipes:0,reward:null};}
function load(){
 try{const raw=JSON.parse(localStorage.getItem(key)||"null");const base=defaultState();const old=raw&&typeof raw==="object"?raw:{};return{...base,...old,done:Array.isArray(old.done)?old.done.filter(Number.isInteger):[],gold:Array.isArray(old.gold)?old.gold:[],secrets:Array.isArray(old.secrets)?old.secrets:[],xp:Number.isFinite(old.xp)?old.xp:0,anxiety:Number.isFinite(old.anxiety)?old.anxiety:100};}
 catch{return defaultState();}
}
let s=load();
function saveLocal(){localStorage.setItem(key,JSON.stringify(s))}
function save(){saveLocal();clearTimeout(syncTimer);syncTimer=setTimeout(cloudSave,250)}
function count(stage){const done=Array.isArray(s.done)?s.done:[];return done.filter(k=>k>=stage*8&&k<(stage+1)*8).length;}
function unlocked(stage){return stage===0||count(stage-1)===8;}
function level(){return s.xp<100?"Салаги":s.xp<300?"Планировщики":s.xp<600?"Стратеги":s.xp<900?"Свадебные гуру":"Легенды ЗАГСа";}
function anxietyText(){return s.anxiety>75?"Пока немного волнительно… и это нормально.":s.anxiety>50?"Потихоньку разбираемся. Уже не так страшно.":s.anxiety>25?"Большая часть дел позади. Дышим спокойнее.":"Вы почти у цели. Осталось совсем немного ❤️";}
function anxietyLabel(){return s.anxiety>75?"Высокая":s.anxiety>50?"Средняя":s.anxiety>25?"Низкая":"Почти ноль";}
function heartProgress(){const done=Array.isArray(s.done)?s.done:[];const gold=Array.isArray(s.gold)?s.gold:[];const cats=[0,1,2,3,4].filter(i=>count(i)===8).length;const golds=gold.filter(Boolean).length;return Math.min(100,Math.round(done.length/40*80+cats/5*10+golds/5*5+(s.finalAdvice?5:0)));}
function heartLabel(p){return p<20?"Начало вашей истории":p<40?"Первые совместные решения":p<60?"Вы уже настоящая команда":p<80?"Большая часть пути пройдена":p<100?"Финальные штрихи":"Ваша история собрана";}
function heartVisual(p){const filled=Math.min(5,Math.ceil(p/20));return "❤️".repeat(filled)+"🤍".repeat(5-filled);}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function complete(stage,t){
 const k=stage*8+t;if(!unlocked(stage)||s.done.includes(k))return;
 s.done.push(k);s.xp+=25;s.anxiety=Math.max(10,Math.round(100-s.done.length*1.35));s.reward={stage,t,discussed:false};save();render();showPopup(TASKS[k][0]);
}
function showNewPairHint(){document.getElementById("access").innerHTML='<div class="card"><b>🔐 Это новая ссылка пары</b><p class="muted">Сохраните данные пары — это устройство станет главным устройством.</p></div>'}
function showAccessGate(){document.getElementById("access").innerHTML='<div class="card"><h3>🔐 Доступ к паре</h3><p class="muted">Эта ссылка защищена. Введите одноразовый код, который создатель пары получил на своём устройстве.</p><input id="inviteCode" inputmode="numeric" maxlength="6" placeholder="6-значный код"><button data-action="redeem-code">Подключить устройство</button><p id="accessMsg" class="muted"></p></div>'}
function showSyncError(){document.getElementById("access").innerHTML='<div class="card"><b>⚠️ Нет связи с облаком</b><p class="muted">Локальный прогресс сохранён. Повторная синхронизация произойдёт автоматически.</p></div>'}
async function generateInvite(){
 if(!ownerToken)return;
 const code=String(Math.floor(100000+Math.random()*900000));const hash=await sha256(code);
 await rpc("issue_pair_code",{p_pair_id:pairId,p_owner_hash:await sha256(ownerToken),p_code_hash:hash,p_expires:new Date(Date.now()+10*60*1000).toISOString()});
 document.getElementById("access").innerHTML='<div class="card reward"><h3>📱 Код для второго устройства</h3><div style="font-size:34px;letter-spacing:8px;text-align:center;font-weight:800">'+code+'</div><p class="muted center">Действует 10 минут и используется один раз.</p><button data-action="hide-access">Скрыть код</button></div>';
}
async function redeemCode(){
 const input=document.getElementById("inviteCode"),msg=document.getElementById("accessMsg"),code=(input?.value||"").replace(/\D/g,"");
 if(code.length!==6){msg.textContent="Введите 6 цифр.";return}
 try{const token=randomToken(),ok=await rpc("redeem_pair_invite",{p_pair_id:pairId,p_code_hash:await sha256(code),p_device_hash:await sha256(token)});if(!ok){msg.textContent="Код недействителен или уже использован.";return}deviceToken=token;localStorage.setItem("nasha_device:"+pairId,deviceToken);document.getElementById("access").innerHTML="";await cloudLoad();}catch(e){msg.textContent="Не удалось подключить устройство.";}}

}
function saveProfile(){
 s.bride=document.getElementById("bride").value.trim().slice(0,40);
 s.groom=document.getElementById("groom").value.trim().slice(0,40);
 s.date=document.getElementById("wdate").value;
 save();render();
 cloudSave();

function discuss(){if(!s.reward||s.reward.discussed)return;s.xp+=10;s.swipes++;s.reward.discussed=true;save();render();}
function closeReward(){s.reward=null;save();render();}
function openGold(i){if(count(i)!==8)return;s.gold[i]=true;save();document.getElementById("play").innerHTML='<div class="card reward"><span class="pill">🏆 Золотой конверт</span><h2>'+escapeHtml(GOLD[i][0])+'</h2><p>'+escapeHtml(GOLD[i][1])+'</p><div class="card"><b>💞 Мини-задание</b><p>'+escapeHtml(GOLD[i][2])+'</p><p>📸 Сделайте фото «только для двоих». Фото не загружается в приложение.</p></div><button data-action="close-play">Совет сохранён ❤️</button></div>';}

function openFinalAdvice(){if(s.done.length<40)return;s.finalAdvice=true;save();document.getElementById("play").innerHTML='<div class="card reward"><span class="pill">🔐 Секрет от Артёма</span><h2>Перед самой свадьбой…</h2><p>'+escapeHtml(FINAL_ADVICE[Math.min(3,Math.floor(s.xp/300))])+'</p><p class="muted">Этот совет остаётся только у вас двоих. Не нужно ничего отмечать — просто сохраните этот момент.</p><button data-action="close-play">Спасибо, Артём ❤️</button></div>';}
function openSecret(i){if(!s.secrets.includes(i)){s.secrets.push(i);s.xp+=35;save();}document.getElementById("play").innerHTML='<div class="card secret"><span class="pill">+35 XP</span><h2>🔐 '+escapeHtml(SECRETS[i][0])+'</h2><p>'+escapeHtml(SECRETS[i][1])+'</p><button data-action="close-play">Глава прожита ❤️</button></div>';}
function showPopup(title){
 const old=document.getElementById("popup");if(old)old.remove();
 const p=document.createElement("div");p.id="popup";p.className="popup";
 p.innerHTML='<div class="popupBox"><div class="popupIcon">🎉</div><h2>Задание выполнено!</h2><p class="xp">💫 +25 XP</p><p><b>'+escapeHtml(title)+'</b></p><p class="host">🎤 Совет Артёма: '+escapeHtml(HOST[s.reward.stage*8+s.reward.t])+'</p><button data-action="close-popup">Продолжить ❤️</button></div>';

function render(){
 document.getElementById("bride").value=s.bride||"";document.getElementById("groom").value=s.groom||"";document.getElementById("wdate").value=s.date||"";
 document.getElementById("share").innerHTML=s.bride&&s.groom?"🔗 Ссылка пары: "+escapeHtml(location.href):"";document.getElementById("ownerTools").innerHTML=ownerToken?'<button type="button" data-action="invite">📱 Пригласить второе устройство</button><button type="button" data-action="revoke">🔒 Отозвать доступ</button>':"";
 document.getElementById("dash").innerHTML=s.bride?'<div class="card"><h2 class="center">'+escapeHtml(s.bride)+' ❤️ '+escapeHtml(s.groom)+'</h2><p class="center">'+(s.date?("До свадьбы: "+Math.max(0,Math.ceil((new Date(s.date+"T12:00:00")-new Date())/86400000))+" дней"):"Дата не выбрана")+"</p><div class="stats"><div class="stat"><b>'+s.xp+'</b>⭐ XP</div><div class="stat"><b>'+s.done.length+'/40</b>✅ дела</div><div class="stat"><b>'+level()+'</b>🎖 уровень</div></div><div class="heartBox"><div class="hearts" id="heartVisual">'+heartVisual(heartProgress())+'</div><div class="heartPct"><b>'+heartProgress()+'%</b> · сердце пары</div><div class="heartLabel">'+heartLabel(heartProgress())+'</div></div><p class="muted">😌 Уровень тревожности: <b>'+s.anxiety+'%</b> · '+anxietyLabel()+'</p><div class="bar"><i style="width:'+s.anxiety+'%"></i></div><p class="muted">'+anxietyText()+'</p></div>':"";
 document.getElementById("route").innerHTML='<div class="card"><h2>🗺️ Ваш свадебный путь</h2><p class="muted">Все задания открытого этапа доступны сразу. Выбирайте любое.</p>'+STAGES.map((x,i)=>{const c=count(i),op=unlocked(i);return '<div class="stage '+(op?"open":"locked")+" "+(c===8?"done":"")+'"><div class="stageTop"><h3>'+x[0]+" "+x[1]+'</h3><span class="badge">'+(c===8?"✓ готово":op?"🔓 открыто":"🔒 закрыто")+'</span></div><p class="muted">'+x[2]+' · '+c+'/8</p>'+TASKS.slice(i*8,i*8+8).map((t,j)=>{const k=i*8+j,d=s.done.includes(k);return '<button type="button" class="task '+(d?"done":"")+'" '+(!op||d?"disabled":"")+' data-action="task" data-stage="'+i+'" data-task="'+j+'">'+(d?"✅":"⬜")+' <span><b>'+escapeHtml(t[0])+'</b><small>'+escapeHtml(t[1])+'</small></span></button>';}).join("")+'</div>';}).join("")+'</div>';
 let goldHTML='<div class="card"><h2>🏆 Золотые конверты</h2>'+GOLD.map((g,i)=>count(i)===8?'<button class="gold" data-action="gold" data-i="'+i+'">'+(s.gold[i]?"✓ ":"🏆 ")+escapeHtml(g[0])+'</button>':"").join("")+'</div>';
 let finalHTML=(Array.isArray(s.done)?s.done.length:0)===40?'<div class="card reward"><span class="pill">💍 40/40</span><h2>Финальный секрет</h2><p>Вы прошли весь свадебный путь. Перед самым днём для вас есть один личный совет от Артёма.</p><button data-action="final-advice">🔐 Открыть секретный совет</button></div>':"";
 let secretsHTML='<div class="card"><h2>🔐 Секретные главы</h2><p class="muted">Не обязательны для прогресса. Каждая даёт +35 XP.</p>'+SECRETS.map((x,i)=>s.secrets.includes(i)?'<button disabled>✓ '+escapeHtml(x[0])+'</button>':'<button data-action="secret" data-i="'+i+'">🔐 '+escapeHtml(x[0])+' · секретная глава</button>').join("")+'</div>';
 let play=document.getElementById("play");
 if(s.reward){const n=s.reward.stage*8+s.reward.t,task=TASKS[n];play.innerHTML='<div class="card reward"><span class="pill">🎉 Задание выполнено · +25 XP</span><h2>'+escapeHtml(task[0])+'</h2><p>🎤 <b>Совет Артёма:</b> '+escapeHtml(HOST[n])+'</p><p>💞 <b>Любовь — это…</b> '+escapeHtml(FUNNY[n])+'</p><div class="card"><b>💬 Мини-свайп</b><p>'+escapeHtml(SWIPE[n%SWIPE.length])+'</p>'+(!s.reward.discussed?'<button data-action="discuss">Обсудили вдвоём · +10 XP</button>':'<p class="muted">✓ Обсуждение отмечено</p>')+'</div><button data-action="close-reward">Продолжить без выбора следующей задачи →</button></div>';}else{play.innerHTML=finalHTML+goldHTML+secretsHTML;}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="task"){complete(Number(b.dataset.stage),Number(b.dataset.task));return;}
 if(a==="save-profile"){saveProfile();return;} if(a==="invite"){generateInvite();return;} if(a==="revoke"){revokeAccess();return;} if(a==="redeem-code"){redeemCode();return;} if(a==="hide-access"){document.getElementById("access").innerHTML="";return;}
 if(a==="discuss"){discuss();return;}
 if(a==="close-reward"){closeReward();return;}
 if(a==="close-popup"){document.getElementById("popup")?.remove();return;}
 if(a==="gold"){openGold(Number(b.dataset.i));return;}
 if(a==="secret"){openSecret(Number(b.dataset.i));return;} if(a==="final-advice"){openFinalAdvice();return;}
 if(a==="close-play"){closePlay();}
});
