<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014">
<title>💍 Наша история — Артём Глинский</title>
<style>
:root{--bg:#101014;--card:#19191f;--line:#34343c;--text:#f7f5f2;--muted:#aaa6ad;--gold:#e9b95d;--green:#79d49b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29221d,#101014 45%);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:18px 15px 60px}.brand{text-align:center;color:#d7b978;font-size:13px}.hero{text-align:center;padding:24px 8px}.hero h1{font:700 44px Georgia,serif;margin:8px 0}.hero p{color:var(--muted);line-height:1.5}
.card{background:rgba(25,25,31,.96);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 14px 35px #0005}
input{width:100%;padding:13px 14px;margin:5px 0;border:1px solid var(--line);border-radius:15px;background:#111118;color:#fff}button{width:100%;padding:13px 14px;margin:5px 0;border:1px solid var(--line);border-radius:15px;background:#25252d;color:#fff;font-weight:700}
button:hover:not(:disabled){border-color:#8d6a31}button:disabled{cursor:default}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#121218;border-radius:15px;padding:10px;text-align:center;font-size:11px}.stat b{display:block;font-size:19px;margin-bottom:3px}
.bar{height:12px;background:#302f35;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#d09c83}.stage{border:1px solid var(--line);border-radius:19px;padding:14px;margin:9px 0}.stage.locked{opacity:.45}.stage.open{border-color:#675331}.stage.done{border-color:#47775a}.stageTop{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;color:#d5c6a8;white-space:nowrap}.task{display:flex;gap:9px;align-items:flex-start;text-align:left;background:#111118;border:1px solid #303038;padding:11px 12px;margin:4px 0}.task b{font-size:14px;line-height:1.2}.task small{font-size:11px;line-height:1.2;color:var(--muted);display:block;margin-top:2px;font-weight:400}.task.done{opacity:.55;border-color:#47775a}.reward{border-color:#8b6a31;background:linear-gradient(145deg,#2b2418,#19191f)}.secret{border-color:#66517b;background:#211b29}.muted{color:var(--muted);font-size:13px}.center{text-align:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#27262d;color:#ddd;font-size:11px}
.popup{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:9999}.popupBox{width:min(520px,100%);background:#19191f;border:1px solid #8b6a31;border-radius:24px;padding:26px;text-align:center;box-shadow:0 25px 80px #000}.popupIcon{font-size:42px}.popupBox h2{margin:8px 0}.popupBox .xp{color:#ffd981}.popupBox .host{color:#d7b978;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">🎤 Ведущий Артём Глинский · авторский формат</div>
<div class="hero"><h1>💍 Наша история</h1><p>Добрейший свадебный квест</p></div>
<div class="card">
<h3>👰🤵 Ваша пара <span class="pill">необязательно сейчас</span></h3>
<input id="bride" maxlength="40" placeholder="Имя невесты">
<input id="groom" maxlength="40" placeholder="Имя жениха">
<input id="wdate" type="date">
<button type="button" data-action="save-profile">💞 Сохранить данные пары</button>
<div id="share" class="muted"></div>
</div>
<div id="dash"></div><div id="play"></div><div id="route"></div>
</div>
<script>
"use strict";
const STAGES=[
["🌱","Основа свадьбы","Первые решения"],
["🌿","Создаём праздник","Площадка и атмосфера"],
["🌳","Мы команда","Гости и организация"],
["🌸","Финальная подготовка","Образы, документы и детали"],
["💍","Главный день","Последние проверки"]
];
const TASKS=[
["Определить дату свадьбы","Выберите дату, которая подходит вам обоим."],["Определить формат свадьбы","Решите, каким должен быть ваш праздник."],["Сформулировать бюджет","Назовите комфортную сумму и основные статьи."],["Распределить роли","Договоритесь, кто за что отвечает."],["Составить приоритеты","Выберите 3 вещи, которые для вас особенно важны."],["Определить город и локацию","Решите, где хотите провести день."],["Определить количество гостей","Сделайте первый рабочий список."],["Составить список обязательных решений","Запишите решения, которые нельзя откладывать."],
["Выбрать площадку","Сравните варианты по вашим главным критериям."],["Определиться со стилем","Соберите настроение свадьбы в нескольких словах."],["Продумать декор","Определите ключевые зоны и детали."],["Выбрать ведущего","Сформулируйте, каким должен быть ведущий."],["Выбрать музыку","Соберите музыку для важных моментов."],["Составить тайминг","Набросайте последовательность дня."],["Определить фото и видео","Решите, какие моменты точно хотите сохранить."],["Продумать церемонию","Обсудите формат и важные слова."],
["Составить список гостей","Уточните имена и контакты."],["Решить вопрос рассадки","Продумайте комфорт гостей."],["Распределить задачи","Назначьте ответственных за конкретные дела."],["Собрать контакты подрядчиков","Сведите всё в один удобный список."],["Обсудить помощь родителей","Договоритесь, где помощь действительно нужна."],["Подготовить приглашения","Согласуйте текст и способ отправки."],["Продумать транспорт гостей","Поймите, кому и как добираться."],["Составить план коммуникации","Решите, где будут все важные обновления."],
["Подобрать образы","Соберите варианты и согласуйте общий настрой."],["Запланировать примерки","Поставьте примерки в календарь."],["Подготовить кольца","Проверьте хранение и готовность колец."],["Проверить документы","Убедитесь, что нужные документы в порядке."],["Собрать emergency-kit","Сложите маленький набор на непредвиденные случаи."],["Продумать красоту и уход","Запланируйте процедуры без лишней спешки."],["Подготовить вещи на утро","Соберите всё заранее."],["Сделать финальный чек-лист","Проверьте всё, что должно быть готово."],
["Подтвердить подрядчиков","Свяжитесь со всеми и подтвердите детали."],["Проверить оплаты и договоры","Сверьте суммы, сроки и договорённости."],["Подтвердить меню","Финально согласуйте еду и особые пожелания."],["Проверить торт","Подтвердите дизайн, вкус и время доставки."],["Подготовить вещи на площадку","Сложите всё по понятным коробкам или сумкам."],["Назначить ответственного","Выберите человека, который сможет решать вопросы."],["Провести финальный штаб вдвоём","Спокойно пройдитесь по всему плану."],["Создать план на случай сюрпризов","Решите, что делать, если что-то пойдёт не по плану."]];
const HOST=[
"Не пытайтесь решить всё за один вечер — один понятный шаг уже двигает вас вперёд.","Сначала договоритесь о главном, а детали подтянутся.","Хороший план оставляет место для живого дня.","Запишите решение так, чтобы через неделю его понял каждый из вас.","Если мнения расходятся, сначала назовите, почему это важно каждому.","Выбирайте не идеальный вариант, а тот, который подходит именно вам.","Проверяйте решения вопросом: «Это делает наш день спокойнее?»","Свадебная подготовка — совместный проект, а не экзамен.","Разделяйте задачи так, чтобы никто не чувствовал себя один.","Не забывайте отмечать уже сделанное — прогресс тоже часть праздника."
];
const SWIPE=["Что для нас важнее всего в этом пункте?","Что сделает этот день именно нашим?","Где мы готовы уступить друг другу?","Что здесь можно упростить без потери смысла?","Что мы хотим вспоминать через десять лет?"];
const FUNNY=["принести кофе, даже если тебя не просили.","отдать последний вкусный кусочек и сделать вид, что не хотелось.","знать, где лежит зарядка другого человека.","сначала обнять, а потом обсуждать таблицу расходов.","смеяться над одной и той же шуткой в сотый раз."];
const GOLD=[
["Не потеряйте главное","Свадьба начинается не с декора, а с человека рядом.","Назовите друг другу то, чего больше всего ждёте в семейной жизни."],
["Сделайте свадьбу своей","Самые сильные истории нельзя скопировать.","Назовите одну деталь, которую хотите сделать только по-своему."],
["Готовьтесь вместе","Подготовка уже становится частью вашей семейной истории.","Отложите дела на пять минут и просто побудьте рядом."],
["Оставьте место настоящему","Лучшие моменты не всегда помещаются в тайминг.","Придумайте маленький момент, понятный только вам двоим."],
["Запомните этот момент","Один день станет воспоминанием на всю жизнь.","Закончите фразу: «В день свадьбы я хочу обязательно запомнить…»"]
];
const SECRETS=[
["Начало истории","Каждый назовите, чего больше всего ждёте от семейной жизни."],["Воспоминание","Загадка: то, что нельзя потрогать, но можно хранить годами. Ответ: воспоминание. Найдите общую фотографию и расскажите её историю."],["Три слова","Каждый назовите три слова, описывающие ваши отношения. Повторы запрещены."],["Наш символ","Найдите рядом предмет, который напоминает вам о вашей паре."],["Вкусное воспоминание","Каждый назовите блюдо, связанное с приятным общим воспоминанием."],["Наша песня","Каждый назовите песню, которая напоминает о вашей истории."],["Через год","Закончите: «Через год я хочу, чтобы мы обязательно…»"],["Тайный знак","Придумайте жест или фразу со смыслом: «давай минуту только вдвоём»."],["Маленькое спасибо","Каждый назовите одну вещь, за которую благодарны друг другу сегодня."],["Финальная глава","Закончите: «Я хочу, чтобы в день нашей свадьбы мы обязательно…»"]
];
const GOLD_KEY="nasha_story_v2";
const pairId=new URLSearchParams(location.search).get("pair")||crypto.randomUUID();
if(!location.search)history.replaceState({},document.title,location.pathname+"?pair="+pairId);
const key=GOLD_KEY+":"+pairId;
function defaultState(){return{done:[],xp:0,anxiety:100,bride:"",groom:"",date:"",gold:[],secrets:[],swipes:0,reward:null};}
function load(){
 try{const raw=JSON.parse(localStorage.getItem(key)||"null");const base=defaultState();const old=raw&&typeof raw==="object"?raw:{};return{...base,...old,done:Array.isArray(old.done)?old.done.filter(Number.isInteger):[],gold:Array.isArray(old.gold)?old.gold:[],secrets:Array.isArray(old.secrets)?old.secrets:[],xp:Number.isFinite(old.xp)?old.xp:0,anxiety:Number.isFinite(old.anxiety)?old.anxiety:100};}
 catch{return defaultState();}
}
let s=load();
function save(){localStorage.setItem(key,JSON.stringify(s));}
function count(stage){return s.done.filter(k=>k>=stage*8&&k<(stage+1)*8).length;}
function unlocked(stage){return stage===0||count(stage-1)===8;}
function level(){return s.xp<100?"Салаги":s.xp<300?"Планировщики":s.xp<600?"Стратеги":s.xp<900?"Свадебные гуру":"Легенды ЗАГСа";}
function anxietyText(){return s.anxiety>75?"Пока немного волнительно… и это нормально.":s.anxiety>50?"Потихоньку разбираемся. Уже не так страшно.":s.anxiety>25?"Большая часть дел позади. Дышим спокойнее.":"Вы почти у цели. Осталось совсем немного ❤️";}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function complete(stage,t){
 const k=stage*8+t;if(!unlocked(stage)||s.done.includes(k))return;
 s.done.push(k);s.xp+=25;s.anxiety=Math.max(10,Math.round(100-s.done.length*1.35));s.reward={stage,t,discussed:false};save();render();showPopup(TASKS[k][0]);
}
function saveProfile(){
 s.bride=document.getElementById("bride").value.trim().slice(0,40);
 s.groom=document.getElementById("groom").value.trim().slice(0,40);
 s.date=document.getElementById("wdate").value;
 save();render();
}
function discuss(){if(!s.reward||s.reward.discussed)return;s.xp+=10;s.swipes++;s.reward.discussed=true;save();render();}
function closeReward(){s.reward=null;save();render();}
function openGold(i){if(count(i)!==8)return;s.gold[i]=true;save();document.getElementById("play").innerHTML='<div class="card reward"><span class="pill">🏆 Золотой конверт</span><h2>'+escapeHtml(GOLD[i][0])+'</h2><p>'+escapeHtml(GOLD[i][1])+'</p><div class="card"><b>💞 Мини-задание</b><p>'+escapeHtml(GOLD[i][2])+'</p><p>📸 Сделайте фото «только для двоих». Фото не загружается в приложение.</p></div><button data-action="close-play">Совет сохранён ❤️</button></div>';}
function closePlay(){document.getElementById("play").innerHTML="";render();}
function openSecret(i){if(!s.secrets.includes(i)){s.secrets.push(i);s.xp+=35;save();}document.getElementById("play").innerHTML='<div class="card secret"><span class="pill">+35 XP</span><h2>🔐 '+escapeHtml(SECRETS[i][0])+'</h2><p>'+escapeHtml(SECRETS[i][1])+'</p><button data-action="close-play">Глава прожита ❤️</button></div>';}
function showPopup(title){
 const old=document.getElementById("popup");if(old)old.remove();
 const p=document.createElement("div");p.id="popup";p.className="popup";
 p.innerHTML='<div class="popupBox"><div class="popupIcon">🎉</div><h2>Задание выполнено!</h2><p class="xp">💫 +25 XP</p><p><b>'+escapeHtml(title)+'</b></p><p class="host">🎤 Совет Артёма: '+escapeHtml(HOST[(s.reward.stage*8+s.reward.t)%HOST.length])+'</p><button data-action="close-popup">Продолжить ❤️</button></div>';
 document.body.appendChild(p);
}
function render(){
 document.getElementById("bride").value=s.bride||"";document.getElementById("groom").value=s.groom||"";document.getElementById("wdate").value=s.date||"";
 document.getElementById("share").innerHTML=s.bride&&s.groom?"🔗 Ссылка пары: "+escapeHtml(location.href):"";
 document.getElementById("dash").innerHTML=s.bride?'<div class="card"><h2 class="center">'+escapeHtml(s.bride)+' ❤️ '+escapeHtml(s.groom)+'</h2><p class="center">'+(s.date?("До свадьбы: "+Math.max(0,Math.ceil((new Date(s.date+"T12:00:00")-new Date())/86400000))+" дней"):"Дата не выбрана")+'</p><div class="stats"><div class="stat"><b>'+s.xp+'</b>⭐ XP</div><div class="stat"><b>'+s.done.length+'/40</b>✅ дела</div><div class="stat"><b>'+level()+'</b>🎖 уровень</div></div><p class="muted">😌 Тревожность: '+s.anxiety+'%</p><div class="bar"><i style="width:'+s.anxiety+'%"></i></div><p class="muted">'+anxietyText()+'</p></div>':"";
 document.getElementById("route").innerHTML='<div class="card"><h2>🗺️ Ваш свадебный путь</h2><p class="muted">Все задания открытого этапа доступны сразу. Выбирайте любое.</p>'+STAGES.map((x,i)=>{const c=count(i),op=unlocked(i);return '<div class="stage '+(op?"open":"locked")+" "+(c===8?"done":"")+'"><div class="stageTop"><h3>'+x[0]+" "+x[1]+'</h3><span class="badge">'+(c===8?"✓ готово":op?"🔓 открыто":"🔒 закрыто")+'</span></div><p class="muted">'+x[2]+' · '+c+'/8</p>'+TASKS.slice(i*8,i*8+8).map((t,j)=>{const k=i*8+j,d=s.done.includes(k);return '<button type="button" class="task '+(d?"done":"")+'" '+(!op||d?"disabled":"")+' data-action="task" data-stage="'+i+'" data-task="'+j+'">'+(d?"✅":"⬜")+' <span><b>'+escapeHtml(t[0])+'</b><small>'+escapeHtml(t[1])+'</small></span></button>';}).join("")+'</div>';}).join("")+'</div>';
 let goldHTML='<div class="card"><h2>🏆 Золотые конверты</h2>'+GOLD.map((g,i)=>count(i)===8?'<button class="gold" data-action="gold" data-i="'+i+'">'+(s.gold[i]?"✓ ":"🏆 ")+escapeHtml(g[0])+'</button>':"").join("")+'</div>';
 let secretsHTML='<div class="card"><h2>🔐 Секретные главы</h2><p class="muted">Не обязательны для прогресса. Каждая даёт +35 XP.</p>'+SECRETS.map((x,i)=>s.secrets.includes(i)?'<button disabled>✓ '+escapeHtml(x[0])+'</button>':'<button data-action="secret" data-i="'+i+'">🔐 '+escapeHtml(x[0])+' · секретная глава</button>').join("")+'</div>';
 let play=document.getElementById("play");
 if(s.reward){const n=s.reward.stage*8+s.reward.t,task=TASKS[n];play.innerHTML='<div class="card reward"><span class="pill">🎉 Задание выполнено · +25 XP</span><h2>'+escapeHtml(task[0])+'</h2><p>🎤 <b>Совет Артёма:</b> '+escapeHtml(HOST[n%HOST.length])+'</p><p>💞 <b>Любовь — это…</b> '+escapeHtml(FUNNY[n%FUNNY.length])+'</p><div class="card"><b>💬 Мини-свайп</b><p>'+escapeHtml(SWIPE[n%SWIPE.length])+'</p>'+(!s.reward.discussed?'<button data-action="discuss">Обсудили вдвоём · +10 XP</button>':'<p class="muted">✓ Обсуждение отмечено</p>')+'</div><button data-action="close-reward">Продолжить без выбора следующей задачи →</button></div>';}else{play.innerHTML=goldHTML+secretsHTML;}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="task"){complete(Number(b.dataset.stage),Number(b.dataset.task));return;}
 if(a==="save-profile"){saveProfile();return;}
 if(a==="discuss"){discuss();return;}
 if(a==="close-reward"){closeReward();return;}
 if(a==="close-popup"){document.getElementById("popup")?.remove();return;}
 if(a==="gold"){openGold(Number(b.dataset.i));return;}
 if(a==="secret"){openSecret(Number(b.dataset.i));return;}
 if(a==="close-play"){closePlay();}
});
render();
</script>
</body>
</html>
